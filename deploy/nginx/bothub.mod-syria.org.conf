# BotHub production reverse proxy
#
# Single file — copy to server:
#   sudo cp deploy/nginx/bothub.mod-syria.org.conf /etc/nginx/sites-available/bothup.mod-syria.org
#   sudo ln -sf /etc/nginx/sites-available/bothup.mod-syria.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# App: docker compose -f docker-compose.prod.yml --env-file .env.prd up -d

upstream bothub_app {
    server 127.0.0.1:3320;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name bothub.mod-syria.org bothup.mod-syria.org;

    client_max_body_size 100M;

    access_log /var/log/nginx/bothub.access.log;
    error_log /var/log/nginx/bothub.error.log;

    location / {
        proxy_pass http://bothub_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }
}
