# Optional HTTPS block — append to bothub.mod-syria.org.conf after certs exist.
#
#   sudo certbot certonly --nginx -d bothub.mod-syria.org -d bothup.mod-syria.org

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bothub.mod-syria.org bothup.mod-syria.org;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/bothub.mod-syria.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bothub.mod-syria.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bothub.access.log;
    error_log /var/log/nginx/bothub.error.log;

    location / {
        proxy_pass http://bothub_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }
}
